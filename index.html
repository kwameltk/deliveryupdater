
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --amber: #F59E0B;
    --amber-light: #FEF3C7;
    --amber-dark: #92400E;
    --green: #10B981;
    --green-light: #ECFDF5;
    --red: #EF4444;
    --red-light: #FEF2F2;
    --blue: #3B82F6;
    --blue-light: #EFF6FF;
    --purple: #8B5CF6;
    --purple-light: #F5F3FF;
    --dark: #111827;
    --mid: #6B7280;
    --border: #E5E7EB;
    --bg: #F9FAFB;
    --white: #ffffff;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; }

  .header { background: var(--dark); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 36px; height: 36px; background: var(--amber); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: var(--dark); flex-shrink: 0; }
  .header h1 { font-size: 15px; font-weight: 600; color: #fff; }
  .header-sub { font-size: 11px; color: #9CA3AF; }
  .tab-toggle { display: flex; background: #1F2937; border-radius: 8px; padding: 3px; gap: 2px; }
  .tab-btn { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.18s; background: transparent; color: #9CA3AF; }
  .tab-btn.active { background: var(--amber); color: var(--dark); }

  .main { padding: 16px; max-width: 900px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }

  .section-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mid); margin-bottom: 8px; }
  .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 11px; font-weight: 500; color: var(--mid); }
  input, select, textarea {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px;
    font-size: 13px; color: var(--dark); background: var(--bg);
    outline: none; transition: border 0.15s; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--amber); background: #fff; }
  textarea { resize: vertical; min-height: 56px; }

  .gps-hint { font-size: 10px; color: var(--mid); margin-top: 3px; }
  .coords-link { display: inline-flex; align-items: center; gap: 4px; color: var(--blue); font-family: monospace; text-decoration: none; }
  .coords-link:hover { text-decoration: underline; }

  .btn-row { display: flex; gap: 8px; margin-top: 4px; align-items: center; }
  .btn { padding: 9px 18px; border-radius: 7px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.15s; }
  .btn-primary { background: var(--amber); color: var(--dark); }
  .btn-primary:hover { background: #D97706; }
  .btn-secondary { background: var(--bg); border: 1px solid var(--border); color: var(--mid); }
  .btn-secondary:hover { border-color: var(--mid); color: var(--dark); }
  .btn-danger { background: var(--red-light); color: var(--red); border: 1px solid #FCA5A5; font-size: 12px; padding: 6px 12px; }
  .btn-danger:hover { background: #FEE2E2; }
  .btn-edit { background: var(--blue-light); color: var(--blue); border: 1px solid #BFDBFE; font-size: 12px; padding: 6px 12px; }
  .btn-edit:hover { background: #DBEAFE; }

  .saved-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--green); background: var(--green-light); border: 1px solid #6EE7B7; padding: 3px 9px; border-radius: 20px; }
  .saved-tag::before { content: '✓'; font-weight: 700; }

  .orders-table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .orders-table { width: 100%; min-width: 860px; border-collapse: collapse; font-size: 12px; }
  .orders-table th { background: var(--bg); padding: 8px 10px; text-align: left; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mid); border-bottom: 1px solid var(--border); }
  .orders-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .orders-table tr:last-child td { border-bottom: none; }
  .orders-table tr:hover td { background: #FAFAFA; }

  .initials-badge { display: inline-block; padding: 3px 8px; border-radius: 5px; background: var(--amber-light); color: var(--amber-dark); font-weight: 700; font-size: 11px; }
  .coords-cell { font-size: 11px; color: var(--blue); font-family: monospace; }

  .status-pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .status-pending   { background: #FEF3C7; color: #92400E; }
  .status-picked    { background: #EFF6FF; color: #1D4ED8; }
  .status-enroute   { background: #F5F3FF; color: #5B21B6; }
  .status-delivered { background: #ECFDF5; color: #065F46; }

  .empty-state { text-align: center; padding: 32px; color: var(--mid); font-size: 13px; }
  .empty-state .icon { font-size: 28px; margin-bottom: 8px; }

  .rider-header { background: var(--dark); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
  .rider-title { font-size: 14px; font-weight: 600; color: #fff; }
  .rider-sub { font-size: 11px; color: #9CA3AF; margin-top: 2px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 5px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .rider-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border-left: 4px solid var(--amber); }
  .rider-card.status-picked    { border-left-color: var(--blue); }
  .rider-card.status-enroute   { border-left-color: var(--purple); }
  .rider-card.status-delivered { border-left-color: var(--green); opacity: 0.7; }

  .rider-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .rider-card-top > div:first-child { min-width: 0; }
  .rider-card-name { font-size: 15px; font-weight: 600; }
  .rider-card-meta { font-size: 12px; color: var(--mid); margin-top: 2px; }
  .rider-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rider-detail { background: var(--bg); border-radius: 7px; padding: 8px 10px; }
  .rider-detail-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mid); margin-bottom: 2px; }
  .rider-detail-value { font-size: 13px; font-weight: 500; color: var(--dark); }
  .rider-coords { font-family: monospace; font-size: 12px; color: var(--blue); }
  .rider-special { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 7px; padding: 8px 10px; margin-top: 8px; font-size: 12px; color: #92400E; }
  .rider-special strong { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
  .map-link { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--blue); text-decoration: none; margin-top: 8px; }
  .map-link:hover { text-decoration: underline; }

  .rider-assignment-controls { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .rider-status-controls { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .rider-status-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mid); }
  .rider-status-actions { display: flex; gap: 8px; align-items: center; width: 100%; max-width: 360px; }
  .rider-select,
  .rider-status-select {
    flex: 1 1 auto; min-width: 180px; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--white); color: var(--dark); font-size: 12px; font-weight: 600; outline: none;
  }
  .rider-status-select.status-picked { background: #EFF6FF; color: #1D4ED8; border-color: #BFDBFE; }
  .rider-status-select.status-enroute { background: #F5F3FF; color: #5B21B6; border-color: #DDD6FE; }
  .rider-status-select.status-delivered { background: #ECFDF5; color: #065F46; border-color: #A7F3D0; }
  .rider-select { width: 100%; max-width: 220px; }

  .month-group { margin-bottom: 14px; }
  .month-group-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--amber-dark); background: var(--amber-light); border: 1px solid #FCD34D;
    border-radius: 999px; padding: 6px 10px; display: inline-flex; margin: 0 0 10px 0;
  }

  .sync-status {
    margin-top: 10px; font-size: 11px; color: var(--mid); display: none;
    padding: 7px 10px; border-radius: 7px; background: #F3F4F6; border: 1px solid var(--border);
  }
  .sync-status.success { color: #065F46; background: #ECFDF5; border-color: #A7F3D0; }
  .sync-status.warning { color: #92400E; background: #FEF3C7; border-color: #FCD34D; }
  .sync-status.error { color: #991B1B; background: #FEF2F2; border-color: #FCA5A5; }

  @media(max-width:600px) {
    .header { padding: 12px; align-items: stretch; flex-direction: column; }
    .header-left { align-items: flex-start; }
    .header-left > div:last-child { min-width: 0; }
    .header-left > div:last-child > div { overflow-wrap: anywhere; }
    .tab-toggle { width: 100%; }
    .tab-btn { flex: 1 1 0; min-height: 40px; }
    .main { padding: 12px; }
    .card { padding: 12px; }
    .form-grid, .form-grid.three { grid-template-columns: 1fr; }
    .rider-detail-grid { grid-template-columns: 1fr; }
    input, select, textarea { width: 100%; min-height: 42px; font-size: 16px; }
    .btn-row { flex-wrap: wrap; }
    .btn-row .btn { min-height: 42px; }
    .rider-header { padding: 12px; align-items: flex-start; gap: 10px; }
    .rider-header .btn { flex-shrink: 0; }
    .rider-card { padding: 12px; }
    .rider-card-top { gap: 8px; }
    .rider-card-top .status-pill { flex: 0 0 auto; }
    .rider-card-name { overflow-wrap: anywhere; }
    .rider-card-meta { line-height: 1.5; }
    .rider-status-actions { flex-direction: column; align-items: stretch; max-width: none; }
    .rider-select, .rider-status-select { min-width: 0; width: 100%; min-height: 42px; }
    .rider-status-actions .btn { width: 100%; min-height: 42px; }
    .orders-table-wrap { margin: 0; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">KFD</div>
    <div>
      <div style="font-size:15px;font-weight:600;color:#fff;">Rider Delivery Status</div>
      <div class="header-sub">Kwahu Food Delivery — Live Order Tracker</div>
    </div>
  </div>
  <div class="tab-toggle">
    <button type="button" class="tab-btn active" data-view="cs">CS Panel</button>
    <button type="button" class="tab-btn" data-view="rider">Rider View</button>
  </div>
</div>

<div class="main">

  <!-- ══ CS PANEL ══ -->
  <div class="view active" id="view-cs">

    <div class="section-label">Add / Update Order</div>
    <div class="card">

      <!-- Row 1: Initials and Contact -->
      <div class="form-grid">
        <div class="form-group">
          <label>Order Initials *</label>
          <input id="f-initials" type="text" placeholder="e.g. K.O" maxlength="6">
        </div>
        <div class="form-group">
          <label>Contact Number</label>
          <input id="f-contact" type="text" placeholder="0XX XXX XXXX">
        </div>
      </div>

      <!-- Row 2: Meal, Area -->
      <div class="form-grid" style="margin-top:10px;">
        <div class="form-group">
          <label>Meal / Order Details</label>
          <input id="f-meal" type="text" placeholder="e.g. Jollof rice + chicken">
        </div>
        <div class="form-group">
          <label>Delivery Area</label>
          <input id="f-area" type="text" placeholder="e.g. Nkwatia, Mpraeso">
        </div>
      </div>

      <!-- Row 3: GPS Coordinates -->
      <div class="form-grid" style="margin-top:10px;">
        <div class="form-group full">
          <label>GPS Coordinates</label>
          <input id="f-gps" type="text" placeholder="e.g. 6.5880, -0.4250">
          <div class="gps-hint">Paste the full GPS coordinate from the customer's pin</div>
        </div>
      </div>

      <!-- Row 4: Status and Rider -->
      <div class="form-grid" style="margin-top:10px;">
        <div class="form-group">
          <label>Delivery Status *</label>
          <select id="f-status">
            <option value="pending">⏳ Pending — Order Received</option>
            <option value="picked">📦 Picked — Rider Collected Order</option>
            <option value="enroute">🛵 En Route — On the Way</option>
            <option value="delivered">✅ Delivered</option>
          </select>
        </div>
        <div class="form-group">
          <label>Assigned Rider</label>
          <select id="f-rider">
            <option value="">Unassigned</option>
            <option value="Rider 1">Rider 1</option>
            <option value="Rider 2">Rider 2</option>
            <option value="Rider 3">Rider 3</option>
          </select>
        </div>
      </div>

      <div class="btn-row" style="margin-top:14px;">
        <button type="button" id="save-order-button" class="btn btn-primary">💾 Save Order</button>
        <button type="button" id="clear-order-button" class="btn btn-secondary">Clear</button>
        <span id="save-feedback" style="display:none;" class="saved-tag">Saved!</span>
      </div>
      <div id="sheet-sync-status" class="sync-status">Waiting for Google Sheet sync…</div>
      <input type="hidden" id="f-edit-id">
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;flex-wrap:wrap;">
      <div class="section-label" style="margin:0;">All Orders</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <button type="button" id="sync-orders-button" class="btn btn-secondary" style="font-size:12px;padding:6px 12px;">↻ Sync Orders</button>
        <span id="order-count" style="font-size:12px;color:var(--mid);"></span>
      </div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="orders-table-wrap" id="orders-list"></div>
    </div>

  </div>

  <!-- ══ RIDER VIEW ══ -->
  <div class="view" id="view-rider">
    <div class="rider-header">
      <div>
        <div class="rider-title">🛵 Your Deliveries</div>
        <div class="rider-sub"><span class="live-dot"></span>Shared delivery details</div>
      </div>
      <button type="button" id="rider-refresh-button" class="btn btn-secondary" style="font-size:12px;padding:6px 12px;">↻ Refresh</button>
    </div>
    <div id="rider-sync-status" class="sync-status">Checking shared order data…</div>
    <div id="rider-cards"></div>
  </div>

</div>

<script type="text/plain">
const GOOGLE_SHEET_DOC_ID = '1NOMpnZpyowoC1rGVjP-rD5Udbr3DazVjHds2bioH-4';
const GOOGLE_SHEET_GVIZ_URL = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_DOC_ID}/gviz/tq?tqx=out:json&sheet=Sheet1&headers=1`;
const STATUS_ORDER = { pending: 0, picked: 1, enroute: 2, delivered: 3 };
const STORAGE_MONTH_PREFIX = 'kfd_orders_month_';
const STORAGE_MONTH_LIST = 'kfd_order_month_keys';
const SUPABASE_URL = 'PASTE_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'PASTE_SUPABASE_ANON_KEY';
const SUPABASE_CONFIGURED = Boolean(
  window.supabase &&
  SUPABASE_URL &&
  SUPABASE_ANON_KEY &&
  SUPABASE_URL !== 'PASTE_SUPABASE_URL' &&
  SUPABASE_ANON_KEY !== 'PASTE_SUPABASE_ANON_KEY'
);
const supabase = SUPABASE_CONFIGURED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } }) : null;

// Central rider list - update here to change available riders across the app
const RIDERS = ['Rider 1', 'Rider 2', 'Rider 3'];

function riderOptionsHtml(selected) {
  const sel = String(selected || '').trim();
  const opts = [`<option value="" ${!sel || sel === 'Unassigned' ? 'selected' : ''}>Unassigned</option>`];
  RIDERS.forEach(r => opts.push(`<option value="${r}" ${r === sel ? 'selected' : ''}>${r}</option>`));
  return opts.join('\n');
}

let orders = [];
let editingId = null;

function parseGpsText(text = '') {
  const cleaned = String(text || '').replace(/[()]/g, '').trim();
  const parts = cleaned.split(',').map(part => part.trim()).filter(Boolean);
  if (parts.length >= 2) {
    const [lat, lng] = parts;
    return { gps: `${lat}, ${lng}`, lat, lng };
  }
  return { gps: cleaned, lat: '', lng: '' };
}

function getMonthKey(dateLike = new Date()) {
  const date = dateLike instanceof Date ? dateLike : new Date(dateLike || Date.now());
  if (Number.isNaN(date.getTime())) return 'invalid-month';
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
}

function getMonthLabel(monthKey = '') {
  const [year, month] = String(monthKey || '').split('-');
  if (!year || !month) return 'Unknown month';
  const date = new Date(Number(year), Number(month) - 1, 1);
  return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}

function formatDate(dateLike) {
  const d = dateLike instanceof Date ? dateLike : new Date(dateLike || Date.now());
  if (Number.isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' +
         d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function normalizeOrder(o = {}) {
  const rawCreated = o.createdAt || o.updatedAt || o.created_at || o.updated_at || o.created || o.updated || new Date().toISOString();
  const dt = rawCreated instanceof Date ? rawCreated.toISOString() : rawCreated;
  const monthKey = o.monthKey || o.month_key || getMonthKey(dt);
  const { gps, lat, lng } = parseGpsText(o.gps || `${o.lat || ''}, ${o.lng || ''}`);
  const createdAt = o.createdAt || o.created_at || dt;
  const updatedAt = o.updatedAt || o.updated_at || dt;
  return {
    ...o,
    id: o.id || uid(),
    rider: o.rider || 'Unassigned',
    status: (o.status || 'pending').toLowerCase(),
    monthKey,
    month_key: o.month_key || monthKey,
    createdAt,
    created_at: o.created_at || createdAt,
    updatedAt,
    updated_at: o.updated_at || updatedAt,
    created: o.created || formatDate(createdAt),
    updated: o.updated || formatDate(updatedAt),
    gps,
    lat,
    lng,
  };
}

function storageIsAvailable() {
  try {
    const testKey = '__kfd_storage_test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
    return true;
  } catch (error) {
    return false;
  }
}

function safeReadJson(key, fallback = []) {
  if (!storageIsAvailable()) return fallback;
  try {
    const raw = localStorage.getItem(key);
    if (raw === null || raw === undefined) return fallback;
    const parsed = JSON.parse(raw);
    return parsed ?? fallback;
  } catch (error) {
    console.warn('Could not read storage key:', key, error);
    return fallback;
  }
}

function safeWriteJson(key, value) {
  if (!storageIsAvailable()) return false;
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (error) {
    console.warn('Could not write storage key:', key, error);
    return false;
  }
}

function loadStoredOrders() {
  const monthKeys = Array.isArray(safeReadJson(STORAGE_MONTH_LIST, [])) ? safeReadJson(STORAGE_MONTH_LIST, []) : [];
  const buckets = monthKeys
    .filter(Boolean)
    .map(monthKey => {
      const payload = safeReadJson(`${STORAGE_MONTH_PREFIX}${monthKey}`, []);
      return Array.isArray(payload) ? payload : [];
    });

  const savedOrders = buckets.flat().map(normalizeOrder);
  if (savedOrders.length) {
    orders = savedOrders.sort((a, b) => new Date(b.updatedAt || b.createdAt).getTime() - new Date(a.updatedAt || a.createdAt).getTime());
    return;
  }

  const legacyOrders = Array.isArray(safeReadJson('kfd_orders', [])) ? safeReadJson('kfd_orders', []).map(normalizeOrder) : [];
  orders = legacyOrders.sort((a, b) => new Date(b.updatedAt || b.createdAt).getTime() - new Date(a.updatedAt || a.createdAt).getTime());
}

function normalizeSheetKey(key = '') {
  return String(key || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
}

function loadGoogleSheetPayload() {
  return new Promise((resolve, reject) => {
    const timeoutId = setTimeout(() => {
      cleanup();
      reject(new Error('Google Sheet load timed out.'));
    }, 15000);

    function cleanup() {
      clearTimeout(timeoutId);
      const script = document.getElementById('kfd-sheet-loader');
      if (script && script.parentNode) script.parentNode.removeChild(script);
    }

    window.google = window.google || {};
    window.google.visualization = window.google.visualization || {};
    window.google.visualization.Query = {
      setResponse: (payload) => {
        cleanup();
        resolve(payload);
      }
    };

    const script = document.createElement('script');
    script.id = 'kfd-sheet-loader';
    script.src = GOOGLE_SHEET_GVIZ_URL;
    script.async = true;
    script.onload = () => {};
    script.onerror = () => {
      cleanup();
      reject(new Error('Google Sheet script could not be loaded.'));
    };

    document.head.appendChild(script);
  });
}

function mapSheetRowToOrder(row = {}) {
  const normalized = Object.fromEntries(
    Object.entries(row || {}).map(([key, value]) => [normalizeSheetKey(key), String(value ?? '').trim()])
  );

  const fullName = normalized.name || normalized.customername || '';
  const initials = normalized.initials || normalized.orderinitials || (fullName ? fullName.split(/\s+/).map(part => part[0]).slice(0, 2).join('').toUpperCase() : '');
  const status = (normalized.status || 'pending').toLowerCase();

  if (!initials && !fullName) return null;

  return {
    id: normalized.id || uid(),
    initials,
    name: fullName,
    contact: normalized.contact || normalized.phonenumber || '',
    meal: normalized.meal || normalized.orderdetails || normalized.order || '',
    area: normalized.area || normalized.deliveryarea || '',
    gps: normalized.gps || normalized.coordinates || normalized.gpscoordinates || '',
    landmark: normalized.landmark || '',
    rider: normalized.rider || normalized.deliveryrider || normalized['delivery rider'] || '',
    status: ['pending', 'picked', 'enroute', 'delivered'].includes(status) ? status : 'pending',
    special: normalized.special || normalized.specialrequests || '',
    created: normalized.created || normalized.date || now(),
    updated: normalized.updated || normalized.lastupdated || now(),
  };
}

function setSyncStatus(message, type = 'warning') {
  ['sheet-sync-status', 'rider-sync-status'].forEach(id => {
    const statusEl = document.getElementById(id);
    if (!statusEl) return;
    statusEl.className = 'sync-status ' + type;
    statusEl.textContent = message;
    statusEl.style.display = 'block';
  });
}

async function syncOrders() {
  if (supabase) {
    const loaded = await loadOrdersFromSupabase();
    setSyncStatus(loaded ? 'Shared orders refreshed.' : 'Shared orders could not be loaded.', loaded ? 'success' : 'error');
    return;
  }

  setSyncStatus('Shared sync is not configured. Add the Supabase URL and anon key before using this page on multiple phones.', 'error');
}

async function loadOrdersFromGoogleSheet() {
  if (window.location.protocol === 'file:') {
    setSyncStatus('Open the tracker from a local web server (http://) to enable live Google Sheet sync.', 'warning');
    return;
  }

  try {
    const payload = await loadGoogleSheetPayload();
    const headers = (payload?.table?.cols || []).map(col => normalizeSheetKey(col.label || col.id));
    const rows = (payload?.table?.rows || []).map((entry) => {
      const values = entry.c || [];
      return Object.fromEntries(headers.map((header, index) => [header, values[index]?.v ?? '']));
    });

    const sheetOrders = rows.map(mapSheetRowToOrder).filter(Boolean);
    if (sheetOrders.length) {
      orders = sheetOrders.map(normalizeOrder);
      save();
      setSyncStatus('Google Sheet synced successfully from the public view endpoint.', 'success');
    } else {
      setSyncStatus('Google Sheet loaded, but no usable delivery rows were found.', 'warning');
    }
  } catch (error) {
    console.warn('Falling back to local tracker data because the public Google Sheet could not be loaded.', error);
    setSyncStatus('Shared sync is not configured. This browser is using its own local copy, so other phones will not see new orders.', 'error');
  }
}

function refreshOrdersFromLocalStorage() {
  const previousSnapshot = JSON.stringify(orders);
  loadStoredOrders();
  if (JSON.stringify(orders) !== previousSnapshot) {
    renderCSList();
    renderRiderView();
  }
}

async function saveToSupabase(orderList = []) {
  if (!supabase) return false;

  const rows = orderList.map(order => ({
    id: order.id,
    initials: order.initials || '',
    name: order.name || '',
    contact: order.contact || '',
    meal: order.meal || '',
    area: order.area || '',
    gps: order.gps || (order.lat && order.lng ? `${order.lat}, ${order.lng}` : ''),
    landmark: order.landmark || '',
    status: order.status || 'pending',
    special: order.special || '',
    rider: order.rider || 'Unassigned',
    created_at: order.createdAt || order.created_at || timestamp(),
    updated_at: order.updatedAt || order.updated_at || timestamp(),
    month_key: order.monthKey || order.month_key || getMonthKey(order.createdAt || order.updatedAt || new Date().toISOString()),
  }));

  const { error } = await supabase.from('orders').upsert(rows, { onConflict: 'id' });
  if (error) {
    console.error('Supabase save failed:', error);
    throw error;
  }

  return true;
}

async function loadOrdersFromSupabase() {
  if (!supabase) return false;

  const { data, error } = await supabase
    .from('orders')
    .select('*')
    .order('updated_at', { ascending: false });

  if (error) {
    console.error('Supabase load failed:', error);
    return false;
  }

  orders = (data || []).map(row => normalizeOrder({
    ...row,
    createdAt: row.created_at,
    updatedAt: row.updated_at,
    monthKey: row.month_key,
  }));
  renderCSList();
  renderRiderView();
  return true;
}

async function save() {
  if (supabase) {
    try {
      await saveToSupabase(orders);
      return true;
    } catch (error) {
      console.warn('Supabase save failed; falling back to local storage.', error);
    }
  }

  if (!storageIsAvailable()) {
    return false;
  }

  const persistedKeys = Array.isArray(safeReadJson(STORAGE_MONTH_LIST, [])) ? safeReadJson(STORAGE_MONTH_LIST, []) : [];
  const bucketMap = {};

  orders.map(normalizeOrder).forEach(order => {
    const bucketKey = order.monthKey || getMonthKey(order.createdAt || order.updatedAt || new Date().toISOString());
    if (!bucketMap[bucketKey]) bucketMap[bucketKey] = [];
    bucketMap[bucketKey].push(order);
  });

  const monthKeys = Object.keys(bucketMap).sort((a, b) => b.localeCompare(a));
  safeWriteJson(STORAGE_MONTH_LIST, monthKeys);

  persistedKeys.forEach(monthKey => {
    if (!bucketMap[monthKey]) {
      try {
        localStorage.removeItem(`${STORAGE_MONTH_PREFIX}${monthKey}`);
      } catch (error) {
        // Ignore storage failures gracefully.
      }
    }
  });

  monthKeys.forEach(monthKey => {
    safeWriteJson(`${STORAGE_MONTH_PREFIX}${monthKey}`, bucketMap[monthKey]);
  });

  safeWriteJson('kfd_orders', orders.map(normalizeOrder));
  return true;
}
function uid()  { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function now()  {
  return formatDate(new Date());
}
function timestamp() { return new Date().toISOString(); }

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  btn.classList.add('active');
  if (tab === 'rider') renderRiderView();
}

function getFormData() {
  const { gps, lat, lng } = parseGpsText(document.getElementById('f-gps').value);
  return {
    initials: document.getElementById('f-initials').value.trim().toUpperCase(),
    contact:  document.getElementById('f-contact').value.trim(),
    meal:     document.getElementById('f-meal').value.trim(),
    area:     document.getElementById('f-area').value.trim(),
    gps,
    lat,
    lng,
    status:   document.getElementById('f-status').value,
    rider:    document.getElementById('f-rider').value.trim(),
  };
}

function fillForm(o) {
  document.getElementById('f-initials').value = o.initials || '';
  document.getElementById('f-contact').value  = o.contact || '';
  document.getElementById('f-meal').value     = o.meal || '';
  document.getElementById('f-area').value     = o.area || '';
  document.getElementById('f-gps').value      = o.gps || (o.lat && o.lng ? `${o.lat}, ${o.lng}` : '');
  document.getElementById('f-status').value   = o.status || 'pending';
  if (document.getElementById('f-rider')) document.getElementById('f-rider').value = o.rider && o.rider !== 'Unassigned' ? o.rider : '';
}

function clearForm() {
  ['f-initials','f-contact','f-meal','f-area','f-gps','f-rider']
    .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  document.getElementById('f-status').value = 'pending';
  editingId = null;
  document.getElementById('save-feedback').style.display = 'none';
}

async function saveOrder(event) {
  if (event) event.preventDefault();
  if (event && event.__kfdSaveHandled) return;
  if (event) event.__kfdSaveHandled = true;
  try {
    const d = getFormData();
    if (!d.initials) { alert('Order Initials are required.'); return; }

    const nowStamp = timestamp();
    const monthKey = getMonthKey(nowStamp);
    const current = orders.find(o => o.id === editingId);

    if (editingId) {
      const idx = orders.findIndex(o => o.id === editingId);
      if (idx > -1) {
        orders[idx] = normalizeOrder({
          ...orders[idx],
          ...d,
          monthKey: current?.monthKey || monthKey,
          createdAt: current?.createdAt || nowStamp,
          updatedAt: nowStamp,
          created: current?.created || now(),
          updated: now(),
        });
      }
    } else {
      orders.unshift(normalizeOrder({
        id: uid(),
        ...d,
        monthKey,
        createdAt: nowStamp,
        updatedAt: nowStamp,
        created: now(),
        updated: now(),
      }));
    }

    orders = orders.sort((a, b) => new Date(b.updatedAt || b.createdAt).getTime() - new Date(a.updatedAt || a.createdAt).getTime());
    const saved = await save();
    if (!saved) {
      setSyncStatus('Order could not be saved. Check browser storage or configure Supabase before trying again.', 'error');
      return;
    }

    clearForm();
    const fb = document.getElementById('save-feedback');
    fb.style.display = 'inline-flex';
    setSyncStatus(supabase ? 'Order saved to shared Supabase data.' : 'Order saved on this device only. Configure Supabase to share it with riders.', supabase ? 'success' : 'warning');
    setTimeout(() => fb.style.display = 'none', 2200);
    renderCSList();
    renderRiderView();
  } catch (error) {
    console.error('Save Order failed:', error);
    setSyncStatus('Order could not be saved. Please check the order fields and try again.', 'error');
  }
}

function editOrder(id) {
  const o = orders.find(o => o.id === id);
  if (!o) return;
  editingId = id;
  fillForm(o);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteOrder(id) {
  if (!confirm('Remove this order from the tracker permanently?')) return;
  orders = orders.filter(o => o.id !== id);
  await save();
  renderCSList();
  renderRiderView();
}

const STATUS_LABELS = { pending:'⏳ Pending', picked:'📦 Picked Up', enroute:'🛵 En Route', delivered:'✅ Delivered' };
function statusPill(s) { return `<span class="status-pill status-${s}">${STATUS_LABELS[s]||s}</span>`; }
function gpsLink(o) {
  const gps = o.gps || (o.lat && o.lng ? `${o.lat}, ${o.lng}` : '');
  if (!gps) return '—';

  const cleaned = String(gps).replace(/[()]/g, '').trim();
  const parts = cleaned.split(',').map(part => part.trim()).filter(Boolean);
  const lat = parts[0];
  const lng = parts[1];

  if (!lat || !lng) return gps;

  const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${lat},${lng}`)}`;
  return `<a class="coords-link" href="${googleMapsUrl}" target="_blank" rel="noopener noreferrer">${gps}</a>`;
}

function renderCSList() {
  const el  = document.getElementById('orders-list');

      acc[key].push(order);

async function updateRiderStatus(orderId, status) {
  const order = orders.find(item => item.id === orderId);
  if (!order) return;

  try {
    const sel = document.querySelector(`select.rider-select[data-order-id="${orderId}"]`);
    if (sel && sel.value) {
      order.rider = sel.value;
    }
  } catch (e) {
    // ignore DOM issues
  }

  order.status = ['picked', 'enroute', 'delivered'].includes(status) ? status : 'pending';
  order.updated = now();
  order.updatedAt = timestamp();
  order.monthKey = order.monthKey || getMonthKey(order.createdAt || order.updatedAt || new Date().toISOString());
  await save();
  renderCSList();
  renderRiderView();
}

async function updateRiderAssignment(orderId, rider) {
  const order = orders.find(item => item.id === orderId);
  if (!order) return;

  order.rider = rider || 'Unassigned';
  order.updated = now();
  order.updatedAt = timestamp();
  order.monthKey = order.monthKey || getMonthKey(order.createdAt || order.updatedAt || new Date().toISOString());
  await save();
  renderCSList();
  renderRiderView();
}

window.addEventListener('storage', (event) => {

async function initSupabaseRealtime() {
  if (!supabase) return;

  const channel = supabase.channel('orders-live');
  channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, () => {
    loadOrdersFromSupabase();
  }).on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, () => {
    loadOrdersFromSupabase();
  }).subscribe();
}

(async function initTracker() {

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const STORAGE_KEY = 'kfd_tracker_orders_v2';

    ? window.supabase.createClient(SHARED_DB_URL, SHARED_DB_KEY, { auth: { persistSession: false } })
    : null;

  let reliableOrders = [];

  const byId = id => document.getElementById(id);
  const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[character]));

  function readOrders() {
    try {
      const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      return Array.isArray(value) ? value : [];
    } catch (error) {
      return [];
    }
  }

  function writeOrders() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(reliableOrders));

    } catch (error) {
      return false;
    }
  }

  async function loadSharedOrders() {

    }));

  async function saveSharedOrder(order) {

    const count = byId('order-count');
    if (!list || !count) return;
    count.textContent = `${reliableOrders.length} order${reliableOrders.length === 1 ? '' : 's'}`;
    if (!reliableOrders.length) {
      list.innerHTML = '<div class="empty-state"><div class="icon">📋</div>No deliveries saved yet.</div>';
      return;
    }

    list.innerHTML = reliableOrders.map(order => `
      <article class="rider-card status-${escapeHtml(order.status)}" data-order-card="${escapeHtml(order.id)}">
        <div class="rider-card-top">
          <div>
            <div class="rider-card-name">Order <span class="initials-badge">${escapeHtml(order.initials)}</span></div>
            <div class="rider-card-meta">${escapeHtml(order.contact || 'No contact')} · ${escapeHtml(formatTimestamp(order.updatedAt))}</div>
          </div>
          <span class="status-pill status-${escapeHtml(order.status)}">${escapeHtml(STATUS_LABELS[order.status] || order.status)}</span>
        </div>
        <div class="rider-detail-grid">
          <div class="rider-detail"><div class="rider-detail-label">Order</div><div class="rider-detail-value">${escapeHtml(order.meal || 'Not provided')}</div></div>
          <div class="rider-detail"><div class="rider-detail-label">Delivery Area</div><div class="rider-detail-value">${escapeHtml(order.area || 'Not provided')}</div></div>
          <div class="rider-detail"><div class="rider-detail-label">Location</div><div class="rider-detail-value rider-coords">${mapLink(order.gps)}</div></div>
          <div class="rider-detail"><div class="rider-detail-label">Assigned Rider</div><select class="rider-select" data-action="assign" data-id="${escapeHtml(order.id)}">${riderOptions(order.rider)}</select></div>
        </div>
        <div class="rider-status-actions" style="margin-top:10px;">
          <select class="rider-status-select status-${escapeHtml(order.status)}" data-action="status" data-id="${escapeHtml(order.id)}">
            <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
            <option value="picked" ${order.status === 'picked' ? 'selected' : ''}>Picked Up</option>
            <option value="enroute" ${order.status === 'enroute' ? 'selected' : ''}>En Route</option>
            <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
          </select>
          <button type="button" class="btn btn-danger" data-action="delete" data-id="${escapeHtml(order.id)}">Delete</button>
        </div>
      </article>
    `).join('');
  }

  function renderRiderCards() {
    const cards = byId('rider-cards');
    if (!cards) return;
    cards.innerHTML = reliableOrders.length
      ? reliableOrders.map(order => `<div class="rider-card status-${escapeHtml(order.status)}"><div class="rider-card-top"><div><div class="rider-card-name">Order <span class="initials-badge">${escapeHtml(order.initials)}</span></div><div class="rider-card-meta">${escapeHtml(order.contact || 'No contact')} · ${escapeHtml(formatTimestamp(order.updatedAt))}</div></div><span class="status-pill status-${escapeHtml(order.status)}">${escapeHtml(STATUS_LABELS[order.status] || order.status)}</span></div><div class="rider-detail-grid"><div class="rider-detail"><div class="rider-detail-label">Order</div><div class="rider-detail-value">${escapeHtml(order.meal || 'Not provided')}</div></div><div class="rider-detail"><div class="rider-detail-label">Delivery Area</div><div class="rider-detail-value">${escapeHtml(order.area || 'Not provided')}</div></div><div class="rider-detail"><div class="rider-detail-label">Location</div><div class="rider-detail-value rider-coords">${mapLink(order.gps)}</div></div><div class="rider-detail"><div class="rider-detail-label">Select Your Identity</div><select class="rider-select" data-action="assign" data-id="${escapeHtml(order.id)}">${riderOptions(order.rider)}</select></div></div></div>`).join('')
      : '<div class="empty-state"><div class="icon">🛵</div>No deliveries available.</div>';
  }

  function clearFormReliable() {
    ['f-initials', 'f-contact', 'f-meal', 'f-area', 'f-gps'].forEach(id => { const field = byId(id); if (field) field.value = ''; });
    if (byId('f-status')) byId('f-status').value = 'pending';
    if (byId('f-rider')) byId('f-rider').value = '';
  }

  async function saveOrderReliable(event) {
    event.preventDefault();
    const initials = byId('f-initials')?.value.trim().toUpperCase();
    if (!initials) {
      setStatus('Enter order initials before saving.', 'error');
      byId('f-initials')?.focus();
      return;
    }
    const now = new Date().toISOString();
    const order = {
      id: `order-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      initials,
      contact: byId('f-contact')?.value.trim() || '',
      meal: byId('f-meal')?.value.trim() || '',
      area: byId('f-area')?.value.trim() || '',
      gps: byId('f-gps')?.value.trim() || '',
      rider: byId('f-rider')?.value || '',
      status: byId('f-status')?.value || 'pending',
      updatedAt: now
    };
    reliableOrders.unshift(order);
    if (!writeOrders()) {
      reliableOrders.shift();
      setStatus('This browser blocked storage, so the order could not be saved.', 'error');
      return;
    }
    if (sharedDb) {
      try {
        await saveSharedOrder(order);
      } catch (error) {
        console.error('Shared order save failed:', error);
        setStatus('Saved on this device, but shared Supabase save failed.', 'error');
        renderOrders();
        renderRiderCards();
        return;
      }
    }
    clearFormReliable();
    renderOrders();
    renderRiderCards();
    setStatus('Order saved. It is now visible in the delivery list below.', 'success');
  }

  async function updateOrder(event) {
    const control = event.target.closest('[data-action]');
    if (!control) return;
    const order = reliableOrders.find(item => item.id === control.dataset.id);
    if (!order) return;
    if (control.dataset.action === 'assign') order.rider = control.value;
    if (control.dataset.action === 'status') order.status = control.value;
    if (control.dataset.action === 'delete') {
      reliableOrders = reliableOrders.filter(item => item.id !== order.id);
      writeOrders();
      renderOrders();
      renderRiderCards();
      return;
    }
    order.updatedAt = new Date().toISOString();
    writeOrders();
    if (sharedDb) {
      try {
        await saveSharedOrder(order);
      } catch (error) {
        console.error('Shared order update failed:', error);
        setStatus('Updated on this device, but shared Supabase update failed.', 'error');
      }
    }
    renderOrders();
    renderRiderCards();
  }

  async function initReliableController() {
    reliableOrders = readOrders();
    if (sharedDb) {
      try {
        await loadSharedOrders();
        setStatus('Shared delivery list connected.', 'success');
      } catch (error) {
        console.error('Shared order load failed:', error);
        setStatus('Could not load shared deliveries. Showing this device\'s saved copy.', 'error');
      }
    } else {
      setStatus('This device is in local mode. Add Supabase credentials to share orders with riders.', 'warning');
    }
    document.querySelectorAll('.tab-btn[data-view]').forEach(button => button.addEventListener('click', () => showView(button.dataset.view)));
    byId('save-order-button')?.addEventListener('click', saveOrderReliable, true);
    byId('clear-order-button')?.addEventListener('click', event => { event.preventDefault(); clearFormReliable(); });
    byId('sync-orders-button')?.addEventListener('click', async () => {
      if (!sharedDb) { setStatus('This device is in local mode. Add Supabase credentials to share orders with riders.', 'warning'); return; }
      try { await loadSharedOrders(); renderOrders(); renderRiderCards(); setStatus('Shared delivery list refreshed.', 'success'); }
      catch (error) { setStatus('Shared delivery list could not be refreshed.', 'error'); }
    });
    byId('rider-refresh-button')?.addEventListener('click', async () => {
      try { if (sharedDb) await loadSharedOrders(); else reliableOrders = readOrders(); renderRiderCards(); setStatus(sharedDb ? 'Shared delivery list refreshed.' : 'Local delivery list refreshed.', sharedDb ? 'success' : 'warning'); }
      catch (error) { setStatus('Shared delivery list could not be refreshed.', 'error'); }
    });
    byId('orders-list')?.addEventListener('change', updateOrder);
    byId('orders-list')?.addEventListener('click', updateOrder);
    byId('rider-cards')?.addEventListener('change', updateOrder);
    renderOrders();
    renderRiderCards();
    if (new URLSearchParams(window.location.search).get('view') === 'rider') showView('rider');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initReliableController);
  else initReliableController();
})();
</script>
</body>
</html>
